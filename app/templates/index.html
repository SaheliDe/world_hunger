<!DOCTYPE html>
<html>

<head>
    <title>Can AI feed the world in crisis?</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-draw/dist/leaflet.draw.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-draw/dist/leaflet.draw.js"></script>
    <style>
        #map {
            height: 600px;
        }

        #log {
            height: 200px;
            overflow-y: scroll;
            border: 1px solid #ccc;
            margin-top: 10px;
            padding: 10px;
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
        }

        #spinner {
            display: none;
            border: 4px solid #f3f3f3;
            border-radius: 50%;
            border-top: 4px solid #3498db;
            width: 20px;
            height: 20px;
            animation: spin 2s linear infinite;
            position: absolute;
            z-index: 1000;
            pointer-events: none;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <h1>Drag a box around the crisis area to generate aid center suggestions.</h1>
    <div id="map"></div>
    <button id="clear-all">Clear All</button>
    <div id="log"></div>
    <div id="spinner"></div>
    <script>
        var map = L.map('map').setView([9.0820, 8.6753], 6);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
        }).addTo(map);

        var drawnItems = new L.FeatureGroup();
        map.addLayer(drawnItems);

        var markers = new L.FeatureGroup();
        map.addLayer(markers);

        var drawControl = new L.Control.Draw({
            edit: { featureGroup: drawnItems },
            draw: {
                polyline: false,
                polygon: false,
                circle: false,
                marker: false,
                circlemarker: false,
                rectangle: true
            }
        });
        map.addControl(drawControl);

        function logMessage(message, success = false) {
            var log = document.getElementById('log');
            var messageElement = document.createElement('p');
            messageElement.textContent = message;
            if (success) {
                messageElement.style.color = 'green';
            }
            log.appendChild(messageElement);
            log.scrollTop = log.scrollHeight;  // Scroll to the bottom
        }

        function showSpinner(show) {
            var spinner = document.getElementById('spinner');
            spinner.style.display = show ? 'block' : 'none';
        }

        document.addEventListener('mousemove', function (e) {
            var spinner = document.getElementById('spinner');
            spinner.style.left = e.pageX + 'px';
            spinner.style.top = e.pageY + 'px';
        });

        map.on('draw:created', function (e) {
            var layer = e.layer;
            drawnItems.addLayer(layer);

            var bounds = layer.getBounds();
            var coord1 = bounds.getNorthWest();
            var coord2 = bounds.getSouthEast();

            logMessage("Selected coordinates: " + coord1 + ", " + coord2);
            logMessage("Starting process, please wait...")

            showSpinner(true);

            fetch('/process', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    coord1: { lat: coord1.lat, lng: coord1.lng },
                    coord2: { lat: coord2.lat, lng: coord2.lng }
                }),
            })
                .then(response => {
                    logMessage("Creating coordinate subset...");
                    return response.json();
                })
                .then(data => {
                    logMessage("Calculating population density clusters...");
                    return data;
                })
                .then(data => {
                    logMessage("Transferring suggested aid center locations to map...");
                    data.forEach(point => {
                        var marker = L.marker([point.lat, point.lng], {
                            icon: L.icon({
                                iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
                                iconSize: [25, 41],
                                iconAnchor: [12, 41],
                                popupAnchor: [1, -34],
                                shadowSize: [41, 41]
                            })
                        });
                        markers.addLayer(marker);
                    });
                    logMessage("Done!", true);
                    showSpinner(false);
                })
                .catch(error => {
                    logMessage("Error: " + error);
                    console.error('Error:', error);
                    showSpinner(false);
                });
        });

        document.getElementById('clear-all').addEventListener('click', function () {
            drawnItems.clearLayers();
            markers.clearLayers();
            document.getElementById('log').innerHTML = '';  // Clear the log messages
        });
    </script>
</body>

</html>
